[advisories]

# Deny yanked crates to catch supply chain issues early.
yanked = "deny"
# Emulate cargo-audit which only checks vulnerabilities and yanked crates, not unmaintained/unsound.
unmaintained = "none"
unsound = "none"

# Ignore proc-macro-error unmaintained warning
# See: https://github.com/aaif-goose/goose/issues/7008
ignore = [
    "RUSTSEC-2023-0071",  # rsa: Marvin Attack timing sidechannel (no safe upgrade available, via jsonwebtoken)
]

# Supply-chain: detect deps pulled from unexpected sources.
[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# Known, intentional git dependencies (local-inference / cuda backends).
allow-git = [
    "https://github.com/jbg/cudaforge",
    "https://github.com/jh-block/mlx-lm",
]

# Supply-chain: forbid wildcard version requirements; surface duplicate versions.
[bans]
multiple-versions = "warn"
# warn (not deny): the public workspace crates use versionless path deps, which
# cargo-deny counts as wildcards on publishable crates; surface real registry
# "*" deps without failing on internal path deps.
wildcards = "warn"
allow-wildcard-paths = true

# License policy. Permissive over a large transitive tree; tighten over time.
[licenses]
confidence-threshold = 0.9
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "MPL-2.0",
    "CC0-1.0",
    "BSL-1.0",
    "OpenSSL",
    "CDLA-Permissive-2.0",
]
