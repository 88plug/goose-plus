name: pnpm audit

# CVE scan of the desktop UI dependency tree (GitHub Advisory DB).
on:
  pull_request:
    paths: ["ui/**"]
  schedule:
    - cron: "23 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    if: github.repository == '88plug/goose-plus'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.0
      # Use hermit (bin/activate-hermit) for pnpm + node — same toolchain the
      # bundle-desktop workflows build with, so the audit sees the exact pinned
      # pnpm/node versions. The pnpm workspace root is ui/ (lockfile lives at
      # ui/pnpm-lock.yaml); pnpm resolves it from ui/desktop.
      - name: Audit desktop dependencies
        run: |
          source ./bin/activate-hermit
          cd ui/desktop
          # Fail if the lockfile drifts from the manifests (supply-chain integrity).
          pnpm install --frozen-lockfile
          pnpm audit --audit-level high --prod
