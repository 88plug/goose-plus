# Mirror aaif-goose/goose main onto 88plug/goose-plus main.
# main is read-only upstream truth — never merge goose-plus into it.
# port/* branches for upstream PRs are based on main.
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

name: Sync upstream main

permissions:
  contents: write

concurrency:
  group: sync-upstream-main
  cancel-in-progress: true

jobs:
  sync:
    name: Mirror aaif-goose/goose main
    if: github.repository == '88plug/goose-plus'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          # Optional belt-and-suspenders: if the "protect main" ruleset's
          # `update` rule rejects the default token, set repo secret SYNC_PAT
          # (admin fine-grained PAT, contents:write) — it inherits the Admin-role
          # bypass. Falls back to GITHUB_TOKEN, which is enough for a plain
          # fast-forward mirror push.
          token: ${{ secrets.SYNC_PAT || github.token }}

      - name: Mirror main from upstream
        run: |
          set -euo pipefail
          # Full fetch (NOT --depth=1): a shallow fetch of upstream's tip omits
          # the commits linking it to the current main, so git can't prove the
          # push is a fast-forward and wrongly rejects it as non-fast-forward.
          git fetch https://github.com/aaif-goose/goose.git main
          UPSTREAM_SHA="$(git rev-parse FETCH_HEAD)"
          LOCAL_SHA="$(git rev-parse HEAD)"
          if [ "$UPSTREAM_SHA" = "$LOCAL_SHA" ]; then
            echo "main already matches upstream ($UPSTREAM_SHA)"
            exit 0
          fi
          git reset --hard "$UPSTREAM_SHA"
          # Plain fast-forward push (no --force) so the non_fast_forward rule is
          # never triggered; the mirror only ever fast-forwards anyway.
          git push origin HEAD:main