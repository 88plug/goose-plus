# Mirror aaif-goose/goose main onto 88plug/goose-plus main.
# main is read-only upstream truth — never merge goose-plus into it.
# port/* branches for upstream PRs are based on main.
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

name: Sync upstream main

permissions:
  contents: write

concurrency:
  group: sync-upstream-main
  cancel-in-progress: true

jobs:
  sync:
    name: Mirror aaif-goose/goose main
    if: github.repository == '88plug/goose-plus'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: main
          fetch-depth: 0
          # main is protected by the "Upstream mirror: protect main" ruleset,
          # whose only bypass actor is the Admin role. The default GITHUB_TOKEN
          # (github-actions[bot]) is NOT a bypass actor, so it cannot push to
          # main — use an admin-owned fine-grained PAT (secret SYNC_PAT) which
          # inherits the Admin-role bypass. Falls back to GITHUB_TOKEN when the
          # secret is absent (push will be blocked until SYNC_PAT is set).
          token: ${{ secrets.SYNC_PAT || github.token }}

      - name: Mirror main from upstream
        run: |
          set -euo pipefail
          git fetch --depth=1 https://github.com/aaif-goose/goose.git main
          UPSTREAM_SHA="$(git rev-parse FETCH_HEAD)"
          LOCAL_SHA="$(git rev-parse HEAD)"
          if [ "$UPSTREAM_SHA" = "$LOCAL_SHA" ]; then
            echo "main already matches upstream ($UPSTREAM_SHA)"
            exit 0
          fi
          git reset --hard "$UPSTREAM_SHA"
          # force-with-lease so the mirror tracks upstream even across a history
          # rewrite (rare); the Admin-role bypass permits the non-fast-forward.
          git push --force-with-lease origin HEAD:main