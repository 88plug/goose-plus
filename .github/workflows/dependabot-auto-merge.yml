name: Dependabot Auto Merge

on:
  pull_request_target:

permissions:
  contents: write
  pull-requests: write

jobs:
  dependabot:
    runs-on: ubuntu-latest
    if: github.event.pull_request.user.login == 'dependabot[bot]' && github.repository == '88plug/goose-plus'
    steps:
      # Auto-merge EVERY Dependabot PR that passes CI — approve + enable
      # auto-merge regardless of semver bump. Safety comes from the required
      # checks (Security audit, CI build/test/lint): GitHub only completes the
      # merge once they're green, so a breaking bump simply stays open (failing,
      # visible) instead of merging. The goal is a hands-off, PR-noise-free fork.
      - name: Approve
        run: gh pr review --approve "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable auto-merge
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
