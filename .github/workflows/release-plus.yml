# goose-plus release pipeline (88plug/goose-plus).
#
# Triggered by pushing a `plus-v*` tag (e.g. plus-v1.39.0) or manually via
# workflow_dispatch. Builds the CLI for all platforms and UNSIGNED desktop
# bundles (88plug has no Apple/Windows signing certs), then publishes a GitHub
# Release on 88plug/goose-plus with the binaries and the install script.
#
# Distinct from the upstream `release.yml` (which triggers on `v1.*` and signs):
# the `plus-v*` tag namespace never collides with it, and every job here is
# guarded to the fork so it no-ops anywhere else.
on:
  push:
    paths-ignore:
      - "documentation/**"
    tags:
      - "plus-v*"
  workflow_dispatch:

name: Release (goose-plus)

permissions:
  contents: write
  id-token: write
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast fail-early gates: a trivial compile error (incl. Windows-only / cfg
  # code) fails in ~1-2 min here instead of 40 min deep in the release matrix.
  # --no-default-features skips local-inference so llama-cpp's C++ isn't built.
  preflight-host:
    name: Preflight - host compile gate
    if: github.repository == '88plug/goose-plus'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6 # v1.16.1
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - run: cargo check -p goose-cli -p goose-server --no-default-features --features rustls-tls --all-targets

  preflight-windows:
    name: Preflight - Windows compile gate
    if: github.repository == '88plug/goose-plus'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6 # v1.16.1
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - run: cargo check -p goose-cli -p goose-server --no-default-features --features rustls-tls

  build-cli:
    needs: [preflight-host, preflight-windows]
    if: github.repository == '88plug/goose-plus'
    uses: ./.github/workflows/build-cli.yml

  install-script:
    name: Upload Install Script (goose-plus)
    if: github.repository == '88plug/goose-plus'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      # Point the install script at the goose-plus releases.
      - name: Retarget install script to 88plug/goose-plus
        run: sed -i 's#aaif-goose/goose#88plug/goose-plus#g' download_cli.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: download_cli.sh
          path: download_cli.sh

  bundle-desktop:
    needs: [preflight-host, preflight-windows]
    if: github.repository == '88plug/goose-plus'
    uses: ./.github/workflows/bundle-desktop.yml
    permissions:
      id-token: write
      contents: read
    # Opt-in OS signing: set repo variable DESKTOP_SIGNING=true and provide an
    # Apple Developer signing environment (DESKTOP_SIGNING_ENVIRONMENT) with the
    # notarization secrets. Defaults to unsigned when those are absent.
    with:
      signing: ${{ vars.DESKTOP_SIGNING == 'true' }}
      environment: ${{ vars.DESKTOP_SIGNING_ENVIRONMENT }}
    secrets: inherit

  bundle-desktop-intel:
    needs: [preflight-host, preflight-windows]
    if: github.repository == '88plug/goose-plus'
    uses: ./.github/workflows/bundle-desktop-intel.yml
    permissions:
      id-token: write
      contents: read
    with:
      signing: ${{ vars.DESKTOP_SIGNING == 'true' }}
      environment: ${{ vars.DESKTOP_SIGNING_ENVIRONMENT }}
    secrets: inherit

  bundle-desktop-linux:
    needs: [preflight-host, preflight-windows]
    if: github.repository == '88plug/goose-plus'
    uses: ./.github/workflows/bundle-desktop-linux.yml

  bundle-desktop-windows:
    needs: [preflight-host, preflight-windows]
    if: github.repository == '88plug/goose-plus'
    uses: ./.github/workflows/bundle-desktop-windows.yml
    permissions:
      id-token: write
      contents: read
      actions: read
    # Opt-in Windows signing: set repo variable DESKTOP_SIGNING=true and provide
    # the Authenticode / Azure Trusted Signing secrets. Unsigned otherwise.
    with:
      signing: ${{ vars.DESKTOP_SIGNING == 'true' }}
    secrets: inherit

  release:
    name: Release (goose-plus)
    if: github.repository == '88plug/goose-plus'
    runs-on: ubuntu-latest
    needs:
      - build-cli
      - install-script
      - bundle-desktop
      - bundle-desktop-intel
      - bundle-desktop-linux
      - bundle-desktop-windows
    permissions:
      contents: write
      id-token: write # keyless Sigstore signing for build-provenance attestation
      attestations: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          merge-multiple: true

      - name: Generate macOS update manifest
        run: node ui/desktop/scripts/generate-mac-update-manifest.js --version "${GITHUB_REF_NAME}" --directory . || true

      # Keyless (Sigstore, GitHub OIDC) signing of every shipped artifact — no
      # certs required. Verify with: gh attestation verify <file> --repo 88plug/goose-plus
      - name: Attest build provenance
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-path: |
            goose-*.tar.bz2
            goose-*.tar.gz
            goose-*.zip
            Goose*.zip
            *.deb
            *.rpm
            *.flatpak
            download_cli.sh

      # Versioned release for this tag.
      - name: Release versioned
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1.21.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          artifacts: |
            goose-*.tar.bz2
            goose-*.tar.gz
            goose-*.zip
            Goose*.zip
            *.deb
            *.rpm
            *.flatpak
            latest-mac.yml
            download_cli.sh
          allowUpdates: true
          body: |
            goose-plus ${{ github.ref_name }} — community fork (88plug/goose-plus).

            Desktop bundles are UNSIGNED: macOS may require right-click → Open
            (Gatekeeper) and Windows may show a SmartScreen prompt.

            CLI install:
            `curl -fsSL https://github.com/88plug/goose-plus/releases/download/stable/download_cli.sh | bash`

      # Rolling "stable" release used by the install script.
      - name: Release stable
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1.21.0
        with:
          tag: stable
          name: Stable (goose-plus)
          token: ${{ secrets.GITHUB_TOKEN }}
          artifacts: |
            goose-*.tar.bz2
            goose-*.tar.gz
            goose-*.zip
            Goose*.zip
            *.deb
            *.rpm
            *.flatpak
            latest-mac.yml
            download_cli.sh
          allowUpdates: true
          omitBody: true
          omitPrereleaseDuringUpdate: true
