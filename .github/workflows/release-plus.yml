# goose-plus release pipeline (88plug/goose-plus).
#
# Triggered by pushing a `plus-v*` tag (e.g. plus-v1.39.0) or manually via
# workflow_dispatch. Builds the CLI for all platforms and UNSIGNED desktop
# bundles (88plug has no Apple/Windows signing certs), then publishes a GitHub
# Release on 88plug/goose-plus with the binaries and the install script.
#
# Distinct from the upstream `release.yml` (which triggers on `v1.*` and signs):
# the `plus-v*` tag namespace never collides with it, and every job here is
# guarded to the fork so it no-ops anywhere else.
on:
  push:
    paths-ignore:
      - "documentation/**"
    tags:
      - "plus-v*"
  workflow_dispatch:

name: Release (goose-plus)

permissions:
  contents: write
  id-token: write
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast fail-early gates on every target OS. A trivial compile error or any
  # warning — including platform-conditional (#[cfg(windows)]/macOS) code — fails
  # in ~2-5 min here under -D warnings (setup-rust-toolchain default; no warnings
  # allowed), instead of ~40 min deep in the build matrix.
  #
  # The CLI check enables the full default feature surface MINUS local-inference
  # (the only feature that pulls llama-cpp's heavy C++). This is what closes the
  # gap that let a Windows-only `unused import` in a feature-gated module (tui,
  # update, ...) pass a bare --no-default-features gate yet fail the real build:
  # those modules are #[cfg(feature = "...")] and must actually be compiled here.
  # One matrix job, all three target OSes in parallel (fail-fast: false), the
  # same shape as build-cli. Each leg is independent so they run concurrently;
  # the build matrix below gates on the whole job (i.e. the slowest leg).
  preflight:
    name: Preflight (${{ matrix.os }})
    if: github.repository == '88plug/goose-plus'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macos-15 pinned (not macos-latest) to avoid the migration notice.
        os: [ubuntu-latest, windows-latest, macos-15]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6 # v1.16.1
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          cache-on-failure: true
      - run: cargo check -p goose-cli --no-default-features --features code-mode,tui,update,aws-providers,telemetry,nostr,otel,system-keyring,rustls-tls --all-targets
      - run: cargo check -p goose-server --no-default-features --features rustls-tls --all-targets

  build-cli:
    needs: [preflight]
    if: github.repository == '88plug/goose-plus'
    uses: ./.github/workflows/build-cli.yml

  install-script:
    name: Upload Install Script (goose-plus)
    if: github.repository == '88plug/goose-plus'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      # Point the install script at the goose-plus releases.
      - name: Retarget install script to 88plug/goose-plus
        run: sed -i 's#aaif-goose/goose#88plug/goose-plus#g' download_cli.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: download_cli.sh
          path: download_cli.sh

  bundle-desktop:
    needs: [preflight]
    if: github.repository == '88plug/goose-plus'
    uses: ./.github/workflows/bundle-desktop.yml
    permissions:
      id-token: write
      contents: read
    # Opt-in OS signing: set repo variable DESKTOP_SIGNING=true and provide an
    # Apple Developer signing environment (DESKTOP_SIGNING_ENVIRONMENT) with the
    # notarization secrets. Defaults to unsigned when those are absent.
    with:
      signing: ${{ vars.DESKTOP_SIGNING == 'true' }}
      environment: ${{ vars.DESKTOP_SIGNING_ENVIRONMENT }}
    secrets: inherit

  bundle-desktop-intel:
    needs: [preflight]
    if: github.repository == '88plug/goose-plus'
    uses: ./.github/workflows/bundle-desktop-intel.yml
    permissions:
      id-token: write
      contents: read
    with:
      signing: ${{ vars.DESKTOP_SIGNING == 'true' }}
      environment: ${{ vars.DESKTOP_SIGNING_ENVIRONMENT }}
    secrets: inherit

  bundle-desktop-linux:
    needs: [preflight]
    if: github.repository == '88plug/goose-plus'
    uses: ./.github/workflows/bundle-desktop-linux.yml

  bundle-desktop-windows:
    needs: [preflight]
    if: github.repository == '88plug/goose-plus'
    uses: ./.github/workflows/bundle-desktop-windows.yml
    permissions:
      id-token: write
      contents: read
      actions: read
    # Opt-in Windows signing: set repo variable DESKTOP_SIGNING=true and provide
    # the Authenticode / Azure Trusted Signing secrets. Unsigned otherwise.
    with:
      signing: ${{ vars.DESKTOP_SIGNING == 'true' }}
    secrets: inherit

  # Browser/web build of the desktop UI (ui/desktop/src/web shim + Vite). Shipped
  # as goose-web-<tag>.zip so self-hosters can serve it against a goosed backend
  # (matched by the goose-*.zip release glob below).
  bundle-web:
    needs: [preflight]
    if: github.repository == '88plug/goose-plus'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Build web bundle
        run: |
          source ./bin/activate-hermit
          cd ui/desktop
          pnpm install --frozen-lockfile
          pnpm run build:web
          cd dist-web
          zip -r "../../../goose-web-${GITHUB_REF_NAME}.zip" .
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: goose-web
          path: goose-web-*.zip
          if-no-files-found: error

  # Zero-annotation policy: fail the run if any job emitted a warning/failure
  # annotation, so warnings can't slip through silently. A small allowlist covers
  # annotations we cannot fix in this repo — third-party actions still on Node 20
  # (ilammy/msvc-dev-cmd, CUDA only), the GitHub macOS image's untrusted Homebrew
  # taps, rust-cache's non-fatal `rustc -vV` probe, and run cancellation / API
  # rate-limit noise. Everything else is a hard failure.
  annotation-gate:
    name: Annotation gate (no warnings)
    needs:
      - preflight
      - build-cli
      - install-script
      - bundle-desktop
      - bundle-desktop-intel
      - bundle-desktop-linux
      - bundle-desktop-windows
      - bundle-web
    if: ${{ always() && github.repository == '88plug/goose-plus' }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      checks: read
    steps:
      - name: Fail on any non-allowlisted annotation
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tmp="$(mktemp)"
          for jid in $(gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/jobs" --jq '.jobs[].id'); do
            gh api "repos/${GITHUB_REPOSITORY}/check-runs/${jid}/annotations" \
              --jq '.[] | select(.annotation_level=="warning" or .annotation_level=="failure") | .message' 2>/dev/null >> "$tmp" || true
          done
          # Drop allowlisted external / transient annotations.
          grep -vaE 'Node\.js 20 is deprecated|taps are not trusted|Homebrew will ignore|was canceled|operation was canceled|hit a rate limit|Command failed: rustc -vV' "$tmp" > "$tmp.f" || true
          if [ -s "$tmp.f" ]; then
            echo "::error::Zero-annotation policy violated — the following annotations must be fixed:"
            sort -u "$tmp.f"
            exit 1
          fi
          echo "No disallowed annotations. ✅"

  release:
    name: Release (goose-plus)
    if: github.repository == '88plug/goose-plus'
    runs-on: ubuntu-latest
    needs:
      - build-cli
      - install-script
      - bundle-desktop
      - bundle-desktop-intel
      - bundle-desktop-linux
      - bundle-desktop-windows
      - bundle-web
    permissions:
      contents: write
      id-token: write # keyless Sigstore signing for build-provenance attestation
      attestations: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          merge-multiple: true

      - name: Generate macOS update manifest
        run: node ui/desktop/scripts/generate-mac-update-manifest.js --version "${GITHUB_REF_NAME}" --directory . || true

      # Keyless (Sigstore, GitHub OIDC) signing of every shipped artifact — no
      # certs required. Verify with: gh attestation verify <file> --repo 88plug/goose-plus
      - name: Attest build provenance
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-path: |
            goose-*.tar.bz2
            goose-*.tar.gz
            goose-*.zip
            Goose*.zip
            *.deb
            *.rpm
            *.flatpak
            *.AppImage
            download_cli.sh

      # Versioned release for this tag.
      - name: Release versioned
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1.21.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          artifacts: |
            goose-*.tar.bz2
            goose-*.tar.gz
            goose-*.zip
            Goose*.zip
            *.deb
            *.rpm
            *.flatpak
            *.AppImage
            latest-mac.yml
            download_cli.sh
          allowUpdates: true
          body: |
            goose-plus ${{ github.ref_name }} — community fork (88plug/goose-plus).

            Desktop bundles are UNSIGNED: macOS may require right-click → Open
            (Gatekeeper) and Windows may show a SmartScreen prompt.

            CLI install:
            `curl -fsSL https://github.com/88plug/goose-plus/releases/download/stable/download_cli.sh | bash`

      # Rolling "stable" release used by the install script.
      - name: Release stable
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1.21.0
        with:
          tag: stable
          name: Stable (goose-plus)
          token: ${{ secrets.GITHUB_TOKEN }}
          artifacts: |
            goose-*.tar.bz2
            goose-*.tar.gz
            goose-*.zip
            Goose*.zip
            *.deb
            *.rpm
            *.flatpak
            *.AppImage
            latest-mac.yml
            download_cli.sh
          allowUpdates: true
          omitBody: true
          omitPrereleaseDuringUpdate: true
