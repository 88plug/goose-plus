version: 2
updates:
  # pnpm workspace for the UI (desktop, acp, text, sdk, goose-binary/*).
  # Point at the workspace ROOT where pnpm-lock.yaml lives so Dependabot updates
  # both the child package.json AND ui/pnpm-lock.yaml in one PR.
  - package-ecosystem: "npm"
    directory: "/ui"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      ui:
        patterns: ["*"]
        update-types:
          - "minor"
          - "patch"

  # Cargo workspace at the repo root.
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      cargo:
        patterns: ["*"]
        update-types:
          - "minor"
          - "patch"
    ignore:
      # Exact-pinned in Cargo.toml on purpose: llama-cpp-2/-sys-2 ship breaking
      # changes in PATCH releases, and icu_* are pinned to satisfy temporal_rs.
      - dependency-name: "llama-cpp-2"
      - dependency-name: "llama-cpp-sys-2"
      - dependency-name: "icu_calendar"
      - dependency-name: "icu_locale"
      # Coupled to the ACP SDK version we ship — bump deliberately, not via auto-PR.
      - dependency-name: "agent-client-protocol"
      - dependency-name: "agent-client-protocol-schema"

  # GitHub Actions used by workflows in .github/workflows. Grouped into ONE PR
  # per run so action bumps don't each open a separate PR (the prior behavior
  # that produced the #1-#5 spam).
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns: ["*"]
